version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wasmbox-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./wasmbox.db
      - DEFAULT_MEMORY_LIMIT_MB=128
      - DEFAULT_EXECUTION_TIMEOUT_SEC=5.0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wasmbox-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
